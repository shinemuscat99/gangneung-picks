<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강릉청년 놀줴이야</title>
  <!-- 한글 폰트 Pretendard (인터넷이 없으면 시스템 기본 한글 폰트로 표시) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 영문·숫자 폰트 Plus Jakarta Sans (한글은 위의 Pretendard로 표시) -->
  <!-- 인터넷이 없으면 두 폰트 모두 시스템 기본 폰트로 바뀌고, 페이지는 그대로 동작합니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- 데이터 파일 입력 오류·안내 (모든 화면 위쪽에 보임) -->
    <div id="data-alerts" class="alerts" hidden>
      <div id="data-error" class="notice notice-error" role="alert" hidden></div>
      <details id="data-warning" class="notice notice-warning" hidden>
        <summary id="warning-summary"></summary>
        <div id="warning-body" class="warning-body"></div>
      </details>
    </div>

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen is-active" aria-labelledby="start-title">
      <div class="start-top">
        <p class="tag-chip tag-chip-strong">강릉 청년을 위한</p>
      </div>

      <!-- 초기 화면 카드: 위 그림 + 아래 제목 -->
      <div class="hero-card">
        <!-- [사진 자리 ①] 초기 화면 그림. 지금은 SVG 풍경(하늘·해·바다·솔숲)이고,
             나중에 사진으로 바꾸려면 아래 <svg> 대신 <img src="사진파일.jpg" alt=""> 를 넣으세요. -->
        <div class="hero-art photo-slot" aria-hidden="true">
          <svg viewBox="0 0 320 240" preserveAspectRatio="xMidYMid slice" focusable="false">
            <defs>
              <linearGradient id="hero-sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#E6F0ED"/>
                <stop offset="1" stop-color="#F4F7F5"/>
              </linearGradient>
              <linearGradient id="hero-shade" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
                <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
              </linearGradient>
            </defs>
            <rect width="320" height="240" fill="url(#hero-sky)"/>
            <circle cx="96" cy="70" r="26" fill="#FFB694" opacity="0.9"/>
            <rect x="0" y="128" width="320" height="112" fill="#BDE9E0"/>
            <path d="M0 150 Q 80 140 160 150 T 320 148 V 240 H 0 Z" fill="#4D7C74" opacity="0.55"/>
            <path d="M0 178 Q 90 166 180 178 T 320 176 V 240 H 0 Z" fill="#34635C" opacity="0.85"/>
            <path d="M232 128 L 248 92 L 264 128 Z M 252 128 L 270 80 L 288 128 Z M 276 128 L 292 98 L 308 128 Z"
                  fill="#2D5E57"/>
            <rect x="0" y="127" width="320" height="2" fill="#FFFFFF" opacity="0.6"/>
            <rect width="320" height="240" fill="url(#hero-shade)"/>
          </svg>
        </div>

        <div class="start-intro">
          <h1 id="start-title">강릉청년<br><span class="title-accent">놀줴이야</span></h1>
          <p class="lead">출발지와 지금 상황, 끌리는 걸 고르면<br>지금 가기 좋은 강릉 가게를 골라 드려요.</p>
        </div>
      </div>

      <button id="btn-start" class="btn btn-primary btn-cta" type="button"><span>시작하기</span><span aria-hidden="true">→</span></button>
    </section>

    <!-- 단계 화면 (출발지 → 상황 → 끌리는 것 → 카페 종류) -->
    <section id="screen-question" class="screen" aria-live="polite">
      <!-- 위쪽에 붙는 막대: [처음부터 다시] [■ 단계 숫자] + 아래 진행 막대 -->
      <header class="topbar">
        <div class="topbar-row">
          <button id="btn-restart" class="btn btn-ghost" type="button">처음부터 다시</button>
          <span id="progress-text" class="step-badge">1 / 3</span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </header>
      <!-- 특정 '출발지 + 상황'일 때만 보이는 추천 카드 (flow.js의 STEP_TIPS) -->
      <div id="step-tip" class="step-tip" hidden></div>
      <h2 id="question-title" class="question-title"></h2>
      <div id="options" class="options"></div>
      <button id="btn-back" class="btn btn-secondary" type="button">← 이전으로</button>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <!-- 결과 요약 카드: 라벨 → 제목 → (구분선) 내가 고른 길 -->
      <div class="result-head">
        <p class="tag-chip">내가 고른 길</p>
        <h2 id="result-title" class="result-title"></h2>
        <p id="route-path" class="route-path"></p>
      </div>

      <p id="result-message" class="result-message" hidden></p>

      <h3 id="same-title" class="section-title"></h3>
      <ol id="same-list" class="place-list"></ol>

      <details id="other-areas" class="other-areas" hidden>
        <summary id="other-summary">다른 동네도 볼래?</summary>
        <div id="other-groups" class="other-groups"></div>
      </details>

      <div id="suggestions" class="suggestions" hidden>
        <p id="suggestion-title" class="suggestion-title"></p>
        <div id="suggestion-list" class="suggestion-list"></div>
      </div>

      <div class="result-actions">
        <button id="btn-result-back" class="btn btn-secondary" type="button">← 이전으로</button>
        <button id="btn-result-restart" class="btn btn-primary" type="button">처음부터 다시</button>
      </div>
    </section>

  </main>

  <!-- flow.js, places.js에 문법 오류가 있을 때 몇 번째 줄인지 알아내기 위한 코드 -->
  <script>
    window.DATA_FILE_ERRORS = {};
    window.addEventListener("error", function (e) {
      ["flow.js", "places.js"].forEach(function (file) {
        if (e.filename && e.filename.indexOf(file) !== -1) {
          window.DATA_FILE_ERRORS[file] = { line: e.lineno, message: e.message };
        }
      });
    });
  </script>
  <script src="flow.js"></script>
  <script src="places.js"></script>
  <script src="app.js"></script>
</body>
</html>
