<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강릉청년 놀줴이야</title>
  <!-- 글꼴: 한글 Pretendard, 영문·숫자 Inter -->
  <!-- 인터넷이 없으면 시스템 기본 글꼴로 바뀌고, 페이지는 그대로 동작합니다. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <main class="app">

    <!-- 데이터 파일 입력 오류·안내 (모든 화면 위쪽에 보임) -->
    <div id="data-alerts" class="alerts" hidden>
      <div id="data-error" class="notice notice-error" role="alert" hidden></div>
      <details id="data-warning" class="notice notice-warning" hidden>
        <summary id="warning-summary"></summary>
        <div id="warning-body" class="warning-body"></div>
      </details>
    </div>

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen is-active" aria-labelledby="start-title">
      <!-- 달과 수평선은 그림 파일 없이 CSS로만 그림 -->
      <div class="horizon" aria-hidden="true"></div>
      <div class="hero">
        <h1 id="start-title"><span class="line">강릉청년</span> <span class="line">놀줴이야</span></h1>
        <p class="lead">지금 상황과 끌리는 것, 동네를 고르면<br>지금 가기 좋은 강릉 가게를 골라 드려요.</p>
      </div>

      <button id="btn-start" class="btn btn-primary btn-cta" type="button">시작하기</button>
    </section>

    <!-- 단계 화면 (상황 → 끌리는 것 → 동네) -->
    <section id="screen-question" class="screen" aria-live="polite">
      <!-- 위쪽 막대: [단계 숫자] + 진행 막대 -->
      <header class="topbar">
        <div class="topbar-row">
          <span id="progress-text" class="step-badge">1 / 3</span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </header>
      <!-- 단계 버튼 [상황] [종류] [위치]: 이미 고른 단계를 누르면 그 단계로 돌아감 (app.js가 채움) -->
      <nav class="step-nav" aria-label="단계 다시 고르기"></nav>
      <!-- 특정 '동네 + 상황'일 때만 보이는 추천 카드 (flow.js의 STEP_TIPS) -->
      <div id="step-tip" class="step-tip" hidden></div>
      <div class="question-head">
        <h2 id="question-title" class="question-title"></h2>
        <p class="question-hint">딱 하나만 골라 주세요.</p>
      </div>
      <div id="options" class="options"></div>
      <div class="question-actions">
        <button id="btn-back" class="btn btn-secondary" type="button">이전으로</button>
        <button id="btn-restart" class="btn btn-secondary" type="button">처음으로</button>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-result" class="screen">
      <!-- 단계 버튼: 결과에서 바로 상황·종류·위치를 다시 고르기 -->
      <nav class="step-nav" aria-label="단계 다시 고르기"></nav>
      <!-- 결과 머리: 제목 → 내가 고른 길 -->
      <div class="result-head">
        <h2 id="result-title" class="result-title"></h2>
        <p id="route-path" class="route-path"></p>
      </div>

      <p id="result-message" class="result-message" hidden></p>

      <h3 id="same-title" class="section-title"></h3>
      <ol id="same-list" class="place-list"></ol>

      <details id="other-areas" class="other-areas" hidden>
        <summary id="other-summary">다른 동네도 볼래?</summary>
        <div id="other-groups" class="other-groups"></div>
      </details>

      <div id="suggestions" class="suggestions" hidden>
        <p id="suggestion-title" class="suggestion-title"></p>
        <div id="suggestion-list" class="suggestion-list"></div>
      </div>

      <div class="result-actions">
        <button id="btn-result-back" class="btn btn-secondary" type="button">이전으로</button>
        <button id="btn-result-restart" class="btn btn-primary" type="button">처음부터 다시</button>
      </div>
    </section>

  </main>

  <!-- flow.js, places.js에 문법 오류가 있을 때 몇 번째 줄인지 알아내기 위한 코드 -->
  <script>
    window.DATA_FILE_ERRORS = {};
    window.addEventListener("error", function (e) {
      ["flow.js", "places.js"].forEach(function (file) {
        if (e.filename && e.filename.indexOf(file) !== -1) {
          window.DATA_FILE_ERRORS[file] = { line: e.lineno, message: e.message };
        }
      });
    });
  </script>
  <script src="flow.js?v=2"></script>
  <script src="places.js?v=2"></script>
  <script src="app.js?v=2"></script>
  <script src="motion.js?v=2"></script>
</body>
</html>
